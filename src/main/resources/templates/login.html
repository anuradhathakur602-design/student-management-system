<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 3px 15px #00000020;
        }

        h2 {
            text-align: center;
            color: #1e293b;
        }

        input {
            width: 92%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            text-align: center;
            font-size: 14px;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Admin Login</h2>

        <p class="message error" th:if="${param.error}">
            Invalid Username or Password!
        </p>

        <p class="message success" th:if="${param.logout}">
            You have been logged out.
        </p>

        <p class="message success" th:if="${param.registered}">
            Registration Successful! Please Login.
        </p>

        <form th:action="@{/login}" method="post">

            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">Login</button>

        </form>

        <p style="text-align:center;">
            Don't have an account?
            <a href="/signup">Create Account</a>
        </p>

    </div>

</body>
</html>
