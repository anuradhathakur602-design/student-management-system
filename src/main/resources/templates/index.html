<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            color: #1e293b;
            text-align: center;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-bar a, .logout-btn {
            background: #2563eb;
            color: white;
            padding: 10px 16px;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .logout-btn {
            background: #dc2626;
        }

        .card {
            background: white;
            padding: 25px;
            margin-top: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
        }

        input {
            width: 95%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #e2e8f0;
        }

        .edit-btn {
            background: #16a34a;
            text-decoration: none;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            margin-right: 5px;
        }

        .delete-btn {
            background: #dc2626;
            text-decoration: none;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top-bar">

        <a href="/dashboard">Admin Dashboard</a>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">Logout</button>
        </form>

    </div>

    <h1>Student Management System</h1>

    <div class="card">
        <h2>Add New Student</h2>

        <form th:action="@{/add}" method="post">

            <label>Student Name</label>
            <input type="text" name="name"
                   placeholder="Enter student name" required>

            <label>Email Address</label>
            <input type="email" name="email"
                   placeholder="Enter email" required>

            <label>Course</label>
            <input type="text" name="course"
                   placeholder="Enter course" required>

            <button type="submit">Add Student</button>

        </form>
    </div>

    <div class="card">
        <h2>Student Records</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="student : ${students}">

                    <td th:text="${student.id}"></td>
                    <td th:text="${student.name}"></td>
                    <td th:text="${student.email}"></td>
                    <td th:text="${student.course}"></td>

                    <td>
                        <a th:href="@{/edit/{id}(id=${student.id})}"
                           class="edit-btn">Edit</a>

                        <a th:href="@{/delete/{id}(id=${student.id})}"
                           class="delete-btn"
                           onclick="return confirm('Delete this student?')">
                            Delete
                        </a>
                    </td>

                </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
